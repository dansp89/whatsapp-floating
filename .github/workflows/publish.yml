name: Publish to npm

# Manual-only for now: the `release` trigger is disabled because GitHub
# Actions is blocked on this account (billing issue). Publish locally via
# `npm publish` in the meantime, or re-add the `release` trigger below
# once Actions is unblocked. Can still be run manually via Actions ->
# "Publish to npm" -> "Run workflow".
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
